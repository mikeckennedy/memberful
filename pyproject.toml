[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memberful"
version = "0.4.0"
description = "Memberful service Python client for webhooks and API"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Michael Kennedy"},
]
maintainers = [
    {name = "Michael Kennedy"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["memberful", "webhooks", "api", "membership", "subscription"]
dependencies = [
    "httpx2>=2.0.0",
    "pydantic>=2.0.0",
    "stamina>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/mikeckennedy/memberful"
Repository = "https://github.com/mikeckennedy/memberful.git"
Issues = "https://github.com/mikeckennedy/memberful/issues"
Changelog = "https://github.com/mikeckennedy/memberful/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/memberful"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
